ignore:
  - "vendor/**/*"
  - "dist/**/*"
  - "examples/**/*"
  - "docs/**/*"

coverage:
  status:
    project: true
    patch: true
    changes: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false # if true: only post the comment if coverage changes
  require_base: true # must have a base report to post
  require_head: true # must have a head report to post
  branches:
    - master

flags:
  zcc:
    paths:
      - internal/**/*.go
    carryforward: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 75%
  individual_flags:
    - name: zcc
      paths:
        - internal/**/*.go
      carryforward: true
      statuses:
        - type: project
          target: 75%
        - type: patch
          target: 100%

github_checks:
  annotations: true
