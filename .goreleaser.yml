# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

before:
  hooks:
    # this is just an example and not a requirement for provider building/publishing
    - go mod tidy
builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like Terraform Cloud where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    # `-X` injects the released semver into the provider's
    # `version.ProviderVersion` symbol at link time so the binary
    # reports the actual git tag instead of the placeholder hard-coded
    # in version/version.go. The previous `-X main.version=...` /
    # `-X main.commit=...` were silently no-oped by the Go linker
    # because no such variables exist in package main.
    ldflags:
      - "-s -w -X github.com/zscaler/terraform-provider-zcc/version.ProviderVersion={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      # Windows-on-ARM is 64-bit only; goreleaser flags `windows/arm`
      # as a broken target in `goreleaser check`.
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  # `formats` (plural) replaces the singular `format` field that was
  # deprecated in GoReleaser v2.6 — see
  # https://goreleaser.com/deprecations/#archivesformat
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  # Visit your project's GitHub Releases page to publish this release.
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # If you want to manually examine the release before its live, uncomment this line:
  # github:
  #   owner: zscaler
  #   name: terraform-provider-zcc
  draft: true
  # `prerelease: auto` flips the GitHub release's Pre-release flag
  # automatically when the tag has a SemVer pre-release suffix
  # (e.g. `v0.1.0-beta.1`, `v0.1.0-rc.1`). Combined with `draft: true`
  # above, the drafted release lands in the GitHub UI with the
  # Pre-release radio already selected, which keeps beta builds off
  # the "latest" channel on both GitHub and the Terraform Registry.
  prerelease: auto
